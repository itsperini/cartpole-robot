[project]
name = "cartpole-robot"
version = "0.1.0"
description = "A MuJoCo cart-pole swing-up environment with TD3 training scripts."
readme = "README.md"
authors = [
    { name = "itsperini", email = "perinim.98@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gymnasium[mujoco]>=1.3.0",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.0",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.20.0",
]

[project.scripts]
cartpole-robot = "cartpole_robot.rollout:main"
cartpole-robot-check = "cartpole_robot.check_env:main"
cartpole-robot-collect = "cartpole_robot.collect_data:main"
cartpole-robot-train = "cartpole_robot.train_td3:main"
cartpole-robot-watch = "cartpole_robot.watch:main"
cartpole-robot-world-eval = "cartpole_robot.eval_world_model:main"
cartpole-robot-world-train = "cartpole_robot.train_world_model:main"
cartpole-robot-world-viz = "cartpole_robot.visualize_world_model:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"
